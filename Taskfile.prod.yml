# https://taskfile.dev

version: '3'

vars:
  DOCKER_COMPOSE: "docker compose --env-file .env.prod -p usctdp_prod -f sage_dev/compose.prod.yaml"
  WP_HOME: /www/srv/usctdp-bedrock/web/wp
  WP_LOG: /www/srv/usctdp-bedrock/web/app/debug.log
  WP_CLI: "{{.DOCKER_COMPOSE}} exec --user www-data --workdir /www/srv/usctdp-bedrock/web/wp web wp"
  THEME_HOME: /www/srv/usctdp-bedrock/web/app/themes/usctdp-theme
  PLUGIN_HOME: /www/srv/usctdp-bedrock/web/app/plugins/usctdp-mgmt
  BEDROCK_ENV_FILE: sage_dev/config/bedrock.env
  APACHE_CONF_FILE: sage_dev/config/apache-wordpress.conf
  NGINX_CONF_FILE: sage_dev/nginx/prod.conf

includes:
  common:
    taskfile: ./Taskfile.common.yml
    vars: {
      MODE: prod,
      DOCKER_COMPOSE: "{{.DOCKER_COMPOSE}}"
    }
    flatten: true


tasks:
  init:
    cmds:
      - cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 10 > .secret_db_password_prod
      - cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 10 > .secret_db_root_password_prod
      - cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 10 > .secret_admin_password_prod
      - cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 10 > .secret_smtp_password_prod
      - cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 10 > .secret_s3_key_file_prod
      - cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 10 > .secret_s3_secret_file_prod
      - python3 gen_config.py .env.prod.template prod

  # Generates the bedrock .env, apache vhost, and nginx configs on the host
  # and writes them to sage_dev/config and sage_dev/nginx, where compose
  # bind-mounts them read-only into the containers. Deliberately independent
  # of up/down: run it once after `init`, and again whenever .env.prod or
  # .env.extra changes. A container restart or recreate just reuses whatever
  # was last generated here - it no longer regenerates or loses config on
  # its own, so it doesn't need this step re-run to come back up cleanly.
  #
  # Bedrock's auth keys are the one exception: they're preserved across
  # re-runs (see gen_bedrock_env.py) rather than regenerated, since
  # regenerating them would silently log everyone out on every deploy.
  configure:
    cmds:
      - python3 gen_bedrock_env.py .env.prod {{.BEDROCK_ENV_FILE}} --extra .env.extra
      - python3 gen_apache_conf.py .env.prod {{.APACHE_CONF_FILE}}
      - python3 gen_nginx_config.py .env.prod sage_dev/nginx/prod.conf.main {{.NGINX_CONF_FILE}}

  # Same as `configure`, but points nginx at the HTTP-only template needed
  # to serve the ACME webroot challenge before a TLS cert exists yet. Use
  # this before the very first `get-cert`; use `configure` after.
  configure-cert-init:
    cmds:
      - python3 gen_bedrock_env.py .env.prod {{.BEDROCK_ENV_FILE}} --extra .env.extra
      - python3 gen_apache_conf.py .env.prod {{.APACHE_CONF_FILE}}
      - python3 gen_nginx_config.py .env.prod sage_dev/nginx/prod.conf.init {{.NGINX_CONF_FILE}}

  up:
    cmds:
      - "{{.DOCKER_COMPOSE}} up -d"

  up-cert-init:
    cmds:
      - "{{.DOCKER_COMPOSE}} up -d proxy web db"

  down:
    cmds:
      - "{{.DOCKER_COMPOSE}} down"

  # nginx and apache don't notice their bind-mounted config file changing on
  # its own - reload the running container after re-running `configure` (or
  # `configure-cert-init`) if you need the new config live without a full
  # restart, e.g. switching from the cert-init nginx config to the real one.
  reload-proxy:
    cmds:
      - "{{.DOCKER_COMPOSE}} exec proxy nginx -s reload"

  reload-web:
    cmds:
      - "{{.DOCKER_COMPOSE}} exec -u root web service apache2 reload"

  # Pulls the new web image and recreates just that container, then reloads
  # proxy so nginx re-resolves web's new IP - without this, proxy keeps
  # sending traffic to the old (now-gone) container's IP and every request
  # 502s until something reloads it. proxy's depends_on: web only affects
  # start order, not recreation of an already-running stack, so this step
  # doesn't happen on its own.
  update-web:
    cmds:
      - "{{.DOCKER_COMPOSE}} pull web"
      - "{{.DOCKER_COMPOSE}} up -d web"
      - task: reload-proxy

  get-cert:
    cmds:
      - >
        {{.DOCKER_COMPOSE}} run --rm --entrypoint "certbot" certbot certonly --webroot
        --webroot-path=/var/www/html
        --email will.snavely@gmail.com
        --agree-tos
        --no-eff-email
        -d usctdp.com -d www.usctdp.com

  wp-deploy:
    cmds:
      - "{{.DOCKER_COMPOSE}} exec --user www-data --workdir {{.WP_HOME}} web bash /app/scripts/web/install_wordpress.sh"
      - "{{.WP_CLI}} plugin activate woocommerce"
      - "{{.WP_CLI}} plugin activate contact-form-7"
      - "{{.WP_CLI}} plugin activate usctdp-mgmt"
      - "{{.WP_CLI}} plugin activate user-switching"
      - "{{.WP_CLI}} plugin activate wp-mail-smtp"
      - "{{.WP_CLI}} plugin activate two-factor"
      - "{{.WP_CLI}} plugin activate seo-by-rank-math"
      - "{{.WP_CLI}} plugin activate redis-cache"
      - "{{.WP_CLI}} plugin activate cache-enabler"
      # No `wp redis enable` step here (unlike dev's deploy task) - the
      # Dockerfile already symlinks object-cache.php/advanced-cache.php into
      # web/app/ at build time, as root, since www-data can't write to
      # web/app's root at runtime here. `wp redis enable` would just print
      # "Redis object cache already enabled." and exit - harmless, but
      # doesn't do anything the symlink hasn't already done, so it's skipped.
      - "{{.WP_CLI}} theme activate usctdp-theme"
      - "{{.WP_CLI}} acorn view:cache"
      - "{{.WP_CLI}} acorn config:cache"
      # `view:cache` above only covers Laravel's normal view-discovery
      # path - it doesn't know about generoi/sage-woocommerce's WooCommerce-
      # template-to-Blade bridge (View::makeLoader(), see
      # ThemeServiceProvider::fixMakeLoaderMacro()), which only runs
      # reactively when wc_get_template() is actually called for a matching
      # template. These pages are the ones with a Blade override under
      # web/app/themes/usctdp-theme/resources/views/woocommerce/ - hitting
      # each once here, sequentially, during the deploy means the first
      # compile happens in a controlled context instead of racing real
      # concurrent traffic (the trigger for the 2026-08-14 /my-account/
      # outage). `|| true` on each: a warming request failing shouldn't
      # block the deploy, the atomic-write fix in fixMakeLoaderMacro()
      # is what actually has to hold if this step is ever skipped/misses one.
      - curl -sfo /dev/null https://usctdp.com/ || true
      - curl -sfo /dev/null https://usctdp.com/shop/ || true
      - curl -sfo /dev/null https://usctdp.com/cart/ || true
      - curl -sfo /dev/null https://usctdp.com/my-account/ || true

# prefork MPM (required by mod_php, which isn't thread-safe) - tuned to
# fit inside the `web` service's container memory limit (currently 1536M,
# see deploy.resources.limits.memory on the web service in
# sage_dev/compose.prod.yaml) together with the 256M PHP memory_limit set
# by memory-limit.ini alongside this file.
#
# horsecatdog/bedrock ships Debian's stock defaults here - StartServers 5,
# MaxRequestWorkers 150, MaxConnectionsPerChild 0 (never recycled) -
# confirmed in the dev container. That assumes a much bigger host: 150
# concurrent workers against an unbounded PHP memory_limit had no real
# ceiling, and a burst of concurrent requests could consume far more RAM
# than the droplet had, forcing it into swap. This was very likely the
# actual root cause of a production thrashing incident (Aug 2026), more so
# than any of the per-container memory limits or backup-job timing looked
# at that same pass.
#
# First landed as MaxRequestWorkers 3 (768M worst case / 1024M container
# limit) - deliberately conservative to stop the thrashing. Raised to 5
# (2026-08) after that fix turned out to have a real cost: with only 3
# workers total for the whole site, a burst of ordinary concurrent traffic
# could exhaust them, making unrelated requests - notably the `two-factor`
# plugin's login-code email, which is sent synchronously via wp_mail() and
# holds its worker for the full SMTP round-trip to SMTP2GO - queue for a
# free worker before they even start. See
# usctdp-2fa-email-delay-worker-starvation (memory) for the diagnosis.
#
# MaxRequestWorkers 5 keeps worst-case PHP memory (5 x 256M = 1280M) safely
# under the 1536M container limit, leaving ~256M of margin for the Apache
# master process and short spikes - a 6th concurrent request queues
# briefly instead of the container getting OOM-killed. Still deliberately
# conservative, now weighed against the droplet's 3:00-3:30am backup
# window (see sage_dev/compose.prod.yaml `backup`/`uploads-backup`
# services): with `web` at 1536M, `db` at 1024M, `redis` 192M, `proxy`
# 128M, `certbot` 64M, plus `backup` 512M and `uploads-backup` 256M
# overlapping their windows, worst-case total is ~3712M against the
# droplet's 4096M - about 384M left for the host OS and Docker daemon.
# That's tighter than before; if backup-window instability shows up,
# either drop back toward 4 workers or shrink `backup`'s/`uploads-backup`'s
# limits rather than raising MaxRequestWorkers further without also
# raising the droplet size.
#
# MaxConnectionsPerChild recycles each worker after 500 requests rather
# than never, to shed any slow per-request memory creep instead of letting
# it accumulate for the container's entire uptime.
#
# Revisit all of these together if the droplet is resized again, the web
# container's memory limit changes, or real traffic patterns turn out to
# need more concurrency than this provides.
StartServers            3
MinSpareServers         2
MaxSpareServers         5
MaxRequestWorkers       5
MaxConnectionsPerChild  500

# prefork MPM (required by mod_php, which isn't thread-safe) - tuned to
# fit inside the `web` service's container memory limit (currently 1024M,
# see deploy.resources.limits.memory on the web service in
# sage_dev/compose.prod.yaml) together with the 256M PHP memory_limit set
# by memory-limit.ini alongside this file.
#
# horsecatdog/bedrock ships Debian's stock defaults here - StartServers 5,
# MaxRequestWorkers 150, MaxConnectionsPerChild 0 (never recycled) -
# confirmed in the dev container. That assumes a much bigger host: 150
# concurrent workers against an unbounded PHP memory_limit had no real
# ceiling, and a burst of concurrent requests could consume far more RAM
# than the droplet had, forcing it into swap. Worth knowing if this is
# revisited: this was very likely the actual root cause of the thrashing
# incident that prompted this whole pass, more so than any of the
# per-container memory limits or backup-job timing looked at earlier.
#
# MaxRequestWorkers 3 keeps worst-case PHP memory (3 x 256M = 768M) safely
# under the 1024M container limit, leaving ~250M of margin for the Apache
# master process and short spikes - a 4th concurrent request queues
# briefly instead of the container getting OOM-killed. This is
# deliberately conservative: a queued request is slow, an OOM-killed
# container is a real (if brief) outage. Loosen it if normal traffic
# turns out to need more concurrency than this comfortably serves -
# StartServers/MinSpareServers/MaxSpareServers scale with it below.
# MaxConnectionsPerChild recycles each worker after 500 requests rather
# than never, to shed any slow per-request memory creep instead of letting
# it accumulate for the container's entire uptime.
#
# Revisit all of these together if the droplet is resized again, the web
# container's memory limit changes, or real traffic patterns turn out to
# need more concurrency than this provides.
StartServers            2
MinSpareServers         1
MaxSpareServers         3
MaxRequestWorkers       3
MaxConnectionsPerChild  500

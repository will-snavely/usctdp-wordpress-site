; Explicit ceiling for every PHP request served by this image.
;
; horsecatdog/bedrock ships memory_limit = -1 (unlimited) by default -
; confirmed via `php -i` in the dev container. Combined with an untuned
; MaxRequestWorkers (see mpm_prefork.conf alongside this file), that meant
; a single heavy request, or a handful of concurrent ones, had no ceiling
; at all and could consume unbounded RAM - a very plausible cause of a
; production "thrashing" incident (Aug 2026) that prompted this whole
; pass. 256M matches WordPress's own common default and comfortably
; covers known heavier paths (WooCommerce checkout, the PhpWord roster
; docgen in usctdp-mgmt) without leaving the ceiling open-ended.
memory_limit = 256M

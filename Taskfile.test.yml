# https://taskfile.dev
#
# Isolated Playwright E2E test stack. Kept as its own included Taskfile
# (like Taskfile.common.yml/Taskfile.prod.yml) rather than nested under
# sage_dev/, since Task resolves an included Taskfile's relative paths
# against *that file's own directory* - staying at the root keeps paths
# here resolving the same as Taskfile.yml's.

version: '3'

vars:
  DOCKER_COMPOSE_TEST: "docker compose --env-file .env.test -p usctdp_test -f sage_dev/compose.test.yaml"
  TEST_PROJECTS_DIR: ./projects_test
  WP_HOME: /www/srv/usctdp-bedrock/web/wp
  WP_CLI_TEST: "{{.DOCKER_COMPOSE_TEST}} exec --user www-data --workdir /www/srv/usctdp-bedrock/web/wp web wp"

tasks:
  init:
    desc: Generate .env.test and its secrets (skips any that already exist).
    cmds:
      - test -f .secret_db_password_test || (cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 10 > .secret_db_password_test)
      - test -f .secret_db_root_password_test || (cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 10 > .secret_db_root_password_test)
      - test -f .secret_admin_password_test || (cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 10 > .secret_admin_password_test)
      - python3 gen_config.py .env.test.template test

  sync:
    desc: Copy the built dev project (theme/plugin assets, vendor) into an isolated tree for the test stack.
    cmds:
      - mkdir -p {{.TEST_PROJECTS_DIR}}
      # web/.htaccess is hardened to root:root 444 by the web container's
      # entrypoint on every start, so an unprivileged rsync can recreate it
      # but not update it in place. Deleting it first (unlink only needs
      # write access to the parent dir) sidesteps that; the container
      # re-hardens the fresh copy on next up.
      - rm -f {{.TEST_PROJECTS_DIR}}/usctdp-bedrock/web/.htaccess
      # web/app/{object-cache,advanced-cache}.php are dev's real, runtime-
      # written drop-ins (unlike prod, which symlinks them at Docker build
      # time) - excluded for the same reason as cache/uploads/.env below:
      # this tree is meant to be a clean environment, and the test stack
      # doesn't run a redis container. Without this exclude, a copied-in
      # object-cache.php makes WordPress try to load it regardless of
      # WP_REDIS_HOST being unset here, falling back to the drop-in's own
      # default of 127.0.0.1:6379 and failing every WP-CLI/HTTP request.
      - >
        rsync -a
        --exclude='.git' --exclude='node_modules'
        --exclude='web/app/cache' --exclude='web/app/uploads' --exclude='.env'
        --exclude='web/app/object-cache.php' --exclude='web/app/advanced-cache.php'
        --exclude='web/app/settings'
        projects/usctdp-bedrock/ {{.TEST_PROJECTS_DIR}}/usctdp-bedrock/
      # Minimal test-only fixtures (one clinic, one session, one priced
      # activity) for `wp usctdp import_products`/`import_sessions` - kept
      # separate from the real data/*.json, and copied in after rsync so a
      # future --delete wouldn't wipe them.
      - cp tests/fixtures/e2e-products.json {{.TEST_PROJECTS_DIR}}/usctdp-bedrock/data/e2e-products.json
      - cp tests/fixtures/e2e-sessions.json {{.TEST_PROJECTS_DIR}}/usctdp-bedrock/data/e2e-sessions.json
      # TEST-ONLY: wires up the checkout-lock delay hook
      # tests/capacity-concurrency.spec.ts uses to force a genuine race
      # (see that mu-plugin's own doc comment for the full reasoning).
      # Lives only in this isolated tree, never in projects/usctdp-bedrock -
      # the real, deployed one - which is exactly why it's copied in here
      # rather than committed under web/app/mu-plugins/ directly.
      - mkdir -p {{.TEST_PROJECTS_DIR}}/usctdp-bedrock/web/app/mu-plugins
      - cp tests/fixtures/mu-plugins/usctdp-test-lock-delay.php {{.TEST_PROJECTS_DIR}}/usctdp-bedrock/web/app/mu-plugins/usctdp-test-lock-delay.php

  up:
    desc: Bring up the isolated test stack (http://127.0.0.1:8180).
    deps: [init, sync]
    cmds:
      - "{{.DOCKER_COMPOSE_TEST}} up -d"

  down:
    desc: Tear down the test stack, keeping its data volumes.
    cmds:
      - "{{.DOCKER_COMPOSE_TEST}} down"

  reset:
    desc: Tear down the test stack and delete its data volumes.
    cmds:
      - "{{.DOCKER_COMPOSE_TEST}} down -v"

  wait-db:
    internal: true
    cmds:
      # A root ping isn't enough: mariadb's image briefly runs a temporary
      # internal server for init SQL, then restarts as the real one - a
      # ping can succeed against that temporary instance moments before
      # the handoff. Connecting as the app user to the app DB only
      # succeeds once init SQL has fully run on the final server.
      # `< /dev/null`: exec -T attaches stdin without a TTY, and Task's
      # non-interactive stdin never sends EOF, so docker hangs waiting on
      # it even after the command finishes. Closed stdin avoids the hang
      # (reproduced: instant in a real terminal, hangs every time under
      # `task`).
      - >
        timeout 180 sh -c 'until {{.DOCKER_COMPOSE_TEST}} exec -T db mariadb -h127.0.0.1 -uwordpress_test -p"$(cat .secret_db_password_test)" wordpress_test -e "SELECT 1" >/dev/null 2>&1 </dev/null; do sleep 2; done'

  seed:
    desc: Install WordPress and activate the theme/plugins against the running test DB.
    deps: [wait-db]
    cmds:
      - "{{.DOCKER_COMPOSE_TEST}} exec web python3 /app/scripts/web/gen_bedrock_config.py usctdp-bedrock"
      - "{{.DOCKER_COMPOSE_TEST}} exec web python3 /app/scripts/web/gen_apache_config.py usctdp-bedrock"
      - "{{.DOCKER_COMPOSE_TEST}} exec web a2ensite wordpress"
      - "{{.DOCKER_COMPOSE_TEST}} exec web a2enmod rewrite"
      - "{{.DOCKER_COMPOSE_TEST}} exec web a2dissite 000-default"
      - "{{.DOCKER_COMPOSE_TEST}} exec web service apache2 reload"
      - "{{.DOCKER_COMPOSE_TEST}} exec --user www-data --workdir {{.WP_HOME}} web bash /app/scripts/web/install_wordpress.sh"
      - "{{.WP_CLI_TEST}} plugin activate woocommerce usctdp-mgmt user-switching wp-mail-smtp two-factor"
      # Minimal product/session/activity/pricing fixtures for the
      # registration test - see tests/fixtures/e2e-*.json. `true` (2nd arg)
      # skips import_products' image/flyer downloads (real URLs point at
      # Google Drive); fine since the products don't need images here.
      - "{{.WP_CLI_TEST}} usctdp import_products /www/srv/usctdp-bedrock/data/e2e-products.json true"
      - "{{.WP_CLI_TEST}} usctdp import_sessions /www/srv/usctdp-bedrock/data/e2e-sessions.json"
      - "{{.WP_CLI_TEST}} theme activate usctdp-theme"
      # Real (non-fixture) page manifest: sets the permalink structure,
      # disables product reviews, and replaces the auto-created
      # Cart/Checkout pages with classic shortcodes. Needed here too (not
      # just prod's) because this site's template overrides assume the
      # classic checkout flow - without it, the default Blocks checkout
      # never fires woocommerce_after_checkout_validation, silently
      # skipping capacity-check/registration-creation logic.
      - "{{.WP_CLI_TEST}} usctdp import_pages /www/srv/usctdp-bedrock/data/pages.json"
      # Storefront-purchase test prerequisites - neither set up by the
      # importer or a fresh WC install, both needed for a hermetic,
      # no-shipping-zone, no-real-gateway checkout:
      # 1. These clinic/tournament products (and their variations) default
      #    to shippable-physical behavior, which needs a shipping
      #    zone/method before checkout allows an order. Marking them
      #    virtual sidesteps that without affecting the
      #    registration/admin-purchase flow.
      # 2. Cash on Delivery is WC's zero-integration gateway and - unlike
      #    BACS/Cheque, which land on "on-hold" - drives orders straight to
      #    "processing", one of the two hooks that fire this site's
      #    purchase/ledger creation (define_woocommerce_hooks() in
      #    class-usctdp-mgmt.php).
      - >
        {{.WP_CLI_TEST}} eval '$id = wc_get_product_id_by_sku("clinic-test-clinic"); $p = wc_get_product($id); $p->set_virtual(true); $p->save(); foreach ($p->get_children() as $vid) { $v = wc_get_product($vid); $v->set_virtual(true); $v->save(); }'
      - >
        {{.WP_CLI_TEST}} eval '$s = get_option("woocommerce_cod_settings", array()); $s["enabled"] = "yes"; update_option("woocommerce_cod_settings", $s);'
      # A fresh WooCommerce install defaults to "Coming Soon" store mode,
      # showing non-admins a placeholder instead of the real store - the
      # storefront test needs the real store live. This also surfaced a
      # real bug (fixed separately in class-usctdp-mgmt-public.php): that
      # placeholder's render path left $product not a WC_Product on
      # is_product() pages, which usctdp-mgmt's enqueue_scripts() assumed.
      - "{{.WP_CLI_TEST}} option update woocommerce_coming_soon no"
      # wp-mail-smtp and WooCommerce each set an activation transient that
      # redirects the next admin page load to their setup wizard - fine
      # for a human, unwanted for a scripted admin session.
      - "{{.WP_CLI_TEST}} transient delete wp_mail_smtp_activation_redirect"
      - "{{.WP_CLI_TEST}} transient delete _wc_activation_redirect"
      # A fresh WP install defaults to "Plain" permalinks. This site's
      # WooCommerce/usctdp-mgmt account endpoints need pretty permalinks,
      # or the My Account canonical-redirect loops indefinitely - the dev
      # DB has had this set manually since creation, but a fresh test
      # install needs it done explicitly.
      #
      # `rewrite structure` no-ops rule regeneration when the target
      # structure already matches (import_pages above already sets it,
      # confirmed empirically via 404s), so `rewrite flush` is used
      # instead (non---hard: --hard tries to regenerate the hand-authored,
      # read-only web/.htaccess, which is both pointless and flaky). It
      # reliably prints success but still exits 1 with an unrelated
      # internal DB-connection error - verified the site works regardless,
      # hence `|| true`.
      - "{{.WP_CLI_TEST}} rewrite flush || true"

  e2e:
    desc: Run the Playwright suite against a fresh, isolated test stack. Always tears the stack down afterward, even on failure.
    cmds:
      - task: init
      - task: sync
      - task: reset
      - task: up
      - defer:
          task: reset
      - task: seed
      - >
        E2E_ADMIN_USER=$(grep '^WP_ADMIN_USER=' .env.test | cut -d= -f2- | tr -d '"')
        E2E_ADMIN_PASSWORD=$(cat .secret_admin_password_test)
        PLAYWRIGHT_BASE_URL=http://127.0.0.1:8180
        npx playwright test

  e2e-keep:
    desc: Same as e2e, but leaves the stack (and its DB) running afterward for inspection - `task test:sql` / `task test:reset` when done.
    cmds:
      - task: init
      - task: sync
      - task: reset
      - task: up
      - task: seed
      - >
        E2E_ADMIN_USER=$(grep '^WP_ADMIN_USER=' .env.test | cut -d= -f2- | tr -d '"')
        E2E_ADMIN_PASSWORD=$(cat .secret_admin_password_test)
        PLAYWRIGHT_BASE_URL=http://127.0.0.1:8180
        npx playwright test

  sql:
    desc: Open a MariaDB root shell against the running test stack for ad-hoc inspection (wordpress_test DB preselected).
    cmds:
      - >
        {{.DOCKER_COMPOSE_TEST}}
        exec -it db sh -c
        'mariadb -u root -p"$(cat /run/secrets/db_root_password_test)" -D wordpress_test'

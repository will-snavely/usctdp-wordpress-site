# https://taskfile.dev
#
# Isolated Playwright E2E test stack. Kept as its own included Taskfile
# (mirrors Taskfile.common.yml/Taskfile.prod.yml living at the repo root)
# rather than nested under sage_dev/, since Task runs an included Taskfile's
# commands relative to *that file's own directory* by default - keeping it
# at the root keeps every relative path here (.env.test, secrets,
# projects_test/, sage_dev/compose.test.yaml) resolving against the repo
# root, same as Taskfile.yml already does.

version: '3'

vars:
  DOCKER_COMPOSE_TEST: "docker compose --env-file .env.test -p usctdp_test -f sage_dev/compose.test.yaml"
  TEST_PROJECTS_DIR: ./projects_test
  WP_HOME: /www/srv/usctdp-bedrock/web/wp
  WP_CLI_TEST: "{{.DOCKER_COMPOSE_TEST}} exec --user www-data --workdir /www/srv/usctdp-bedrock/web/wp web wp"

tasks:
  init:
    desc: Generate .env.test and its secrets (skips any that already exist).
    cmds:
      - test -f .secret_db_password_test || (cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 10 > .secret_db_password_test)
      - test -f .secret_db_root_password_test || (cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 10 > .secret_db_root_password_test)
      - test -f .secret_admin_password_test || (cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 10 > .secret_admin_password_test)
      - python3 gen_config.py .env.test.template test

  sync:
    desc: Copy the built dev project (theme/plugin assets, vendor) into an isolated tree for the test stack.
    cmds:
      - mkdir -p {{.TEST_PROJECTS_DIR}}
      # web/.htaccess is deliberately hardened to root:root 444 by the web
      # container's entrypoint (update_dev_permissions.sh) on every start,
      # in both the dev copy and this one - an unprivileged rsync can create
      # it fresh but can't update its metadata once it exists (that's the
      # whole point of the hardening). Deleting it first (allowed - unlink
      # only needs write access to the parent dir, not the file itself)
      # sidesteps that; the container re-hardens its copy again on next up.
      - rm -f {{.TEST_PROJECTS_DIR}}/usctdp-bedrock/web/.htaccess
      - >
        rsync -a
        --exclude='.git' --exclude='node_modules'
        --exclude='web/app/cache' --exclude='web/app/uploads' --exclude='.env'
        projects/usctdp-bedrock/ {{.TEST_PROJECTS_DIR}}/usctdp-bedrock/
      # Minimal test-only fixtures (one clinic, one session, one priced
      # activity) for `wp usctdp import_products`/`import_sessions` - kept
      # as separate files rather than overwriting the real data/*.json, and
      # copied in after the rsync above since rsync --delete would remove
      # anything not present in the source project.
      - cp tests/fixtures/e2e-products.json {{.TEST_PROJECTS_DIR}}/usctdp-bedrock/data/e2e-products.json
      - cp tests/fixtures/e2e-sessions.json {{.TEST_PROJECTS_DIR}}/usctdp-bedrock/data/e2e-sessions.json

  up:
    desc: Bring up the isolated test stack (http://127.0.0.1:8180).
    deps: [init, sync]
    cmds:
      - "{{.DOCKER_COMPOSE_TEST}} up -d"

  down:
    desc: Tear down the test stack, keeping its data volumes.
    cmds:
      - "{{.DOCKER_COMPOSE_TEST}} down"

  reset:
    desc: Tear down the test stack and delete its data volumes.
    cmds:
      - "{{.DOCKER_COMPOSE_TEST}} down -v"

  wait-db:
    internal: true
    cmds:
      # A root `ping` isn't enough: the official mariadb image briefly runs
      # a *temporary* internal server to execute init SQL (create the
      # wordpress_test DB/user), shuts it down, then starts the real one -
      # a root ping can succeed against that temporary instance moments
      # before the port briefly closes for the handoff, so install_wordpress
      # then hits a connection refused. Connecting as the actual app user to
      # the actual app DB only succeeds once init SQL has fully run on the
      # final server, which is what's actually being waited for.
      # `< /dev/null` on the exec: docker compose exec -T disables the
      # pseudo-TTY but still attaches stdin, and stdin under Task's
      # non-interactive execution never sends EOF on its own - docker's
      # exec then waits on that stdin stream indefinitely even though the
      # containered mariadb command itself already finished. Feeding it an
      # already-closed stdin sidesteps the hang entirely. (Matches the
      # symptom seen: identical command worked instantly typed into a real
      # terminal, hung every time under `task`.)
      - >
        timeout 180 sh -c 'until {{.DOCKER_COMPOSE_TEST}} exec -T db mariadb -h127.0.0.1 -uwordpress_test -p"$(cat .secret_db_password_test)" wordpress_test -e "SELECT 1" >/dev/null 2>&1 </dev/null; do sleep 2; done'

  seed:
    desc: Install WordPress and activate the theme/plugins against the running test DB.
    deps: [wait-db]
    cmds:
      - "{{.DOCKER_COMPOSE_TEST}} exec web python3 /app/scripts/web/gen_bedrock_config.py usctdp-bedrock"
      - "{{.DOCKER_COMPOSE_TEST}} exec web python3 /app/scripts/web/gen_apache_config.py usctdp-bedrock"
      - "{{.DOCKER_COMPOSE_TEST}} exec web a2ensite wordpress"
      - "{{.DOCKER_COMPOSE_TEST}} exec web a2enmod rewrite"
      - "{{.DOCKER_COMPOSE_TEST}} exec web a2dissite 000-default"
      - "{{.DOCKER_COMPOSE_TEST}} exec web service apache2 reload"
      - "{{.DOCKER_COMPOSE_TEST}} exec --user www-data --workdir {{.WP_HOME}} web bash /app/scripts/web/install_wordpress.sh"
      - "{{.WP_CLI_TEST}} plugin activate woocommerce usctdp-mgmt user-switching wp-mail-smtp two-factor"
      # Minimal product/session/activity/pricing fixtures for the
      # registration test - see tests/fixtures/e2e-*.json. `true` (2nd arg)
      # skips import_products' image/flyer downloads (real URLs point at
      # Google Drive; skipped downloads just leave products imageless,
      # which is fine here).
      - "{{.WP_CLI_TEST}} usctdp import_products /www/srv/usctdp-bedrock/data/e2e-products.json true"
      - "{{.WP_CLI_TEST}} usctdp import_sessions /www/srv/usctdp-bedrock/data/e2e-sessions.json"
      - "{{.WP_CLI_TEST}} theme activate usctdp-theme"
      # The real (non-fixture) page manifest: sets the permalink structure,
      # disables product reviews, and - the part that matters for the
      # storefront-purchase test - overwrites the auto-created Cart/Checkout
      # pages with the classic [woocommerce_cart]/[woocommerce_checkout]
      # shortcodes. The site doesn't support WooCommerce Blocks checkout
      # (heavy template overrides assume the classic flow), so this needs to
      # be part of the test stack's setup, not just prod's - without it, the
      # test stack renders the default Blocks checkout, which never fires
      # woocommerce_after_checkout_validation (a classic-only hook), silently
      # skipping this site's capacity-check/registration-creation logic.
      - "{{.WP_CLI_TEST}} usctdp import_pages /www/srv/usctdp-bedrock/data/pages.json"
      # Storefront-purchase test prerequisites. Neither is set up by the
      # importer/a fresh WC install, and both are needed for a hermetic,
      # no-shipping-zone, no-real-gateway checkout:
      # 1. Nothing in usctdp-mgmt ever calls set_virtual() on these
      #    clinic/tournament products, so they default to WooCommerce's
      #    standard shippable-physical-product behavior, which would need a
      #    shipping zone/method configured before checkout allows placing an
      #    order at all. Marking the test product (and its variations -
      #    WooCommerce checks each cart line individually) virtual sidesteps
      #    needing any shipping setup, and doesn't affect anything the
      #    registration/admin-purchase flow relies on.
      # 2. Cash on Delivery is WooCommerce core's zero-integration gateway
      #    (no external API, no sandbox credentials) and - unlike
      #    BACS/Cheque, which land on "on-hold" - drives the order straight
      #    to "processing" by default, which is one of the two hooks
      #    (woocommerce_order_status_processing / woocommerce_payment_complete)
      #    that fire this site's own purchase/ledger creation
      #    (class-usctdp-mgmt.php's define_woocommerce_hooks()).
      - >
        {{.WP_CLI_TEST}} eval '$id = wc_get_product_id_by_sku("clinic-test-clinic"); $p = wc_get_product($id); $p->set_virtual(true); $p->save(); foreach ($p->get_children() as $vid) { $v = wc_get_product($vid); $v->set_virtual(true); $v->save(); }'
      - >
        {{.WP_CLI_TEST}} eval '$s = get_option("woocommerce_cod_settings", array()); $s["enabled"] = "yes"; update_option("woocommerce_cod_settings", $s);'
      # A fresh WooCommerce install defaults to "Coming Soon" store mode
      # (onboarding-only state - a real launched site wouldn't have this
      # enabled), which shows non-admins a placeholder instead of the real
      # store on every product/shop/cart/checkout page. Also surfaced a real
      # bug: WooCommerce renders that placeholder via a get_header() call
      # that bypasses normal single-product setup, and usctdp-mgmt's
      # enqueue_scripts() assumed the $product global would always be a
      # WC_Product on any is_product() page - fixed separately in
      # class-usctdp-mgmt-public.php, but the storefront test still needs
      # the real store live to test anything.
      - "{{.WP_CLI_TEST}} option update woocommerce_coming_soon no"
      # Both wp-mail-smtp (Core.php) and WooCommerce
      # (OnboardingSetupWizard.php) set a transient on activation that
      # redirects the *next* authenticated admin page load to their own
      # setup wizard, taking over the screen. Fine for a human clicking
      # through setup once; unwanted for a scripted admin session that
      # expects the normal dashboard.
      - "{{.WP_CLI_TEST}} transient delete wp_mail_smtp_activation_redirect"
      - "{{.WP_CLI_TEST}} transient delete _wc_activation_redirect"
      # A fresh WP install defaults to "Plain" permalinks (?page_id=N). This
      # site's WooCommerce/usctdp-mgmt account endpoints (My Account > Family
      # etc., see class-usctdp-mgmt-activator.php) need pretty permalinks -
      # without them, WooCommerce's own canonical-redirect logic for the My
      # Account page loops indefinitely. The dev DB has had this set once,
      # manually, since it was first created; a fresh test install needs it
      # done explicitly every time.
      #
      # `wp rewrite structure '/%postname%/'` used to be the final word here,
      # but `usctdp import_pages` (above) already sets permalink_structure to
      # this same value - and `rewrite structure` apparently no-ops the
      # actual rule regeneration when the target structure already matches
      # the current option (confirmed empirically: product pages 404'd after
      # import_pages ran first, and a plain `wp rewrite flush` - which
      # unconditionally regenerates rules regardless of whether the
      # structure string changed - fixed it). `rewrite flush` (default,
      # non---hard mode - --hard also tries to regenerate web/.htaccess via
      # a self-HTTP request, which is both pointless here since .htaccess is
      # hand-authored and made read-only by update_dev_permissions.sh
      # specifically to block that, and was a source of flakiness) reliably
      # prints "Success: Rewrite rules flushed." and then, just as reliably,
      # exits 1 with a trailing "Error establishing a database connection"
      # from something internal to the command itself. Manually verified the
      # resulting site works correctly regardless, so `|| true` here rather
      # than failing the whole seed over a wp-cli-internal exit code that
      # doesn't reflect the operation's actual outcome.
      - "{{.WP_CLI_TEST}} rewrite flush || true"

  e2e:
    desc: Run the Playwright suite against a fresh, isolated test stack. Always tears the stack down afterward, even on failure.
    cmds:
      - task: init
      - task: sync
      - task: reset
      - task: up
      - defer:
          task: reset
      - task: seed
      - >
        E2E_ADMIN_USER=$(grep '^WP_ADMIN_USER=' .env.test | cut -d= -f2- | tr -d '"')
        E2E_ADMIN_PASSWORD=$(cat .secret_admin_password_test)
        PLAYWRIGHT_BASE_URL=http://127.0.0.1:8180
        npx playwright test

  e2e-keep:
    desc: Same as e2e, but leaves the stack (and its DB) running afterward for inspection - `task test:sql` / `task test:reset` when done.
    cmds:
      - task: init
      - task: sync
      - task: reset
      - task: up
      - task: seed
      - >
        E2E_ADMIN_USER=$(grep '^WP_ADMIN_USER=' .env.test | cut -d= -f2- | tr -d '"')
        E2E_ADMIN_PASSWORD=$(cat .secret_admin_password_test)
        PLAYWRIGHT_BASE_URL=http://127.0.0.1:8180
        npx playwright test

  sql:
    desc: Open a MariaDB root shell against the running test stack for ad-hoc inspection (wordpress_test DB preselected).
    cmds:
      - >
        {{.DOCKER_COMPOSE_TEST}}
        exec -it db sh -c
        'mariadb -u root -p"$(cat /run/secrets/db_root_password_test)" -D wordpress_test'

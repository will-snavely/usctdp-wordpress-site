# https://taskfile.dev

version: '3'

vars:
  DOCKER_COMPOSE: "docker compose --env-file .env.dev -p usctdp_dev -f sage_dev/compose.dev.yaml"
  WP_HOME: /www/srv/usctdp-bedrock/web/wp
  WP_LOG: /www/srv/usctdp-bedrock/web/app/debug.log
  WP_CLI: "{{.DOCKER_COMPOSE}} exec --user www-data --workdir /www/srv/usctdp-bedrock/web/wp web wp"
  THEME_HOME: /www/srv/usctdp-bedrock/web/app/themes/usctdp-theme
  PLUGIN_HOME: /www/srv/usctdp-bedrock/web/app/plugins/usctdp-mgmt

includes:
  common:
    taskfile: ./Taskfile.common.yml
    vars: {
      MODE: dev,
      DOCKER_COMPOSE: "{{.DOCKER_COMPOSE}}"
    }
    flatten: true
  test:
    taskfile: ./Taskfile.test.yml

tasks:
  init:
    cmds:
      - cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 10 > .secret_db_password_dev
      - cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 10 > .secret_db_root_password_dev
      - cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 10 > .secret_admin_password_dev
      - python3 gen_config.py .env.dev.template dev
      - python3 init_dev_perms.py .env.dev dev

  up:
    cmds:
      - "{{.DOCKER_COMPOSE}} up -d"

  down:
    cmds:
      - "{{.DOCKER_COMPOSE}} down"

  clean:
    cmds:
      - "{{.DOCKER_COMPOSE}} down -v"
      - sudo rm -f projects/usctdp-bedrock/.env
      - sudo rm -rf projects/usctdp-bedrock/vendor
      - sudo rm -rf {{.THEME_HOME}}/vendor
      - sudo rm -rf {{.THEME_HOME}}/node_modules
      - sudo rm -rf {{.PLUGIN_HOME}}/vendor
      - sudo rm -rf {{.PLUGIN_HOME}}/node_modules

  deploy:
    cmds:
      - >
        python3 sage_dev/sage.py
        --web_container usctdp_dev-web-1
        build
        --project usctdp-bedrock --theme usctdp-theme
      - "{{.DOCKER_COMPOSE}} exec --workdir {{.PLUGIN_HOME}} web npm install"
      - "{{.DOCKER_COMPOSE}} exec --workdir {{.PLUGIN_HOME}} web npm run dev"
      - >
        python3 sage_dev/bedrock.py
        --web_container usctdp_dev-web-1 deploy
        --name usctdp-bedrock
      - sudo chgrp -R usctdp_devs projects
      - sudo chmod -R g+rw projects
      - "{{.DOCKER_COMPOSE}} exec --user www-data --workdir {{.WP_HOME}} web bash /app/scripts/web/install_wordpress.sh"
      - "{{.WP_CLI}} plugin activate woocommerce"
      - "{{.WP_CLI}} plugin activate usctdp-mgmt"
      - "{{.WP_CLI}} plugin activate user-switching"
      - "{{.WP_CLI}} plugin activate wp-mail-smtp"
      - "{{.WP_CLI}} plugin activate two-factor"
      - "{{.WP_CLI}} plugin activate seo-by-rank-math"
      - "{{.WP_CLI}} plugin activate redis-cache"
      - "{{.WP_CLI}} plugin activate cache-enabler"
      - "{{.WP_CLI}} plugin activate fluent-crm"
      - "{{.WP_CLI}} redis enable"
      - "{{.WP_CLI}} theme activate usctdp-theme"

  build-theme:
    cmds:
      - >
        python3 sage_dev/sage.py
        --web_container usctdp_dev-web-1
        build
        --project usctdp-bedrock --theme usctdp-theme

  dev-perms:
    cmds:
      - sudo chgrp -R usctdp_devs projects
      - sudo chmod -R g+rw projects

  # Commits + pushes everything in the usctdp-mgmt plugin, then bumps and
  # pushes its submodule pointer in usctdp-bedrock and in this repo.
  # Parent commits include only the pointer - nothing else staged or
  # modified there gets swept in.
  #   task commit-plugin -- "fix roster regeneration"
  commit-plugin:
    desc: Commit and push usctdp-mgmt, then its pointer in both parent repos
    silent: true
    env:
      COMMIT_MSG: '{{.CLI_ARGS}}'
    cmds:
      - |
        set -euo pipefail
        if [ -z "$COMMIT_MSG" ]; then
          echo 'Usage: task commit-plugin -- "commit message"' >&2
          exit 1
        fi

        BEDROCK=projects/usctdp-bedrock
        PLUGIN_REL=web/app/plugins/usctdp-mgmt
        PLUGIN="$BEDROCK/$PLUGIN_REL"

        for repo in "$PLUGIN" "$BEDROCK" .; do
          if ! git -C "$repo" symbolic-ref -q HEAD >/dev/null; then
            echo "$repo is in detached HEAD - check out a branch first." >&2
            exit 1
          fi
        done

        echo "== usctdp-mgmt"
        git -C "$PLUGIN" add -A
        if git -C "$PLUGIN" diff --cached --quiet; then
          echo "Nothing to commit in the plugin; pushing any unpushed commits."
        else
          git -C "$PLUGIN" commit -m "$COMMIT_MSG"
        fi
        git -C "$PLUGIN" push origin HEAD

        echo "== usctdp-bedrock"
        if git -C "$BEDROCK" diff --quiet -- "$PLUGIN_REL"; then
          echo "Plugin pointer unchanged."
        else
          git -C "$BEDROCK" add "$PLUGIN_REL"
          git -C "$BEDROCK" commit -m "usctdp-mgmt: $COMMIT_MSG" -- "$PLUGIN_REL"
        fi
        git -C "$BEDROCK" push origin HEAD

        echo "== usctdp-wordpress-site"
        if git diff --quiet -- "$BEDROCK"; then
          echo "Bedrock pointer unchanged."
        else
          git add "$BEDROCK"
          git commit -m "usctdp-mgmt: $COMMIT_MSG" -- "$BEDROCK"
        fi
        git push origin HEAD
